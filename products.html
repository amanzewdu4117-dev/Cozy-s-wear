<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - Cozy's Wear</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<body>

<header>
<h1>📦 Products</h1>
<p>የእቃዎች አስተዳደር እና መመዝገቢያ</p>
</header>

<!-- እቃ መመዝገቢያ (በተኑ ሲነካ ፓስወርድ ይጠይቃል) -->
<div class="card">
<h3>አዲስ እቃ መመዝገቢያ</h3>
<select id="productOwner">
<option value="">-- ባለቤት ይምረጡ --</option>
</select>
<input id="productName" placeholder="የእቃው ስም (ምሳሌ፦ ጃኬት)">
<input id="productPrice" placeholder="የአንዱ እቃ ዋጋ (ETB)" type="number">
<input id="productStock" placeholder="ብዛት (Quantity)" type="number">
<button onclick="checkPasswordAndAdd()">➕ Add Product</button>
</div>

<div class="card">
<h2>የእቃዎች ዝርዝር (Products List)</h2>
<ul id="productList"></ul>
</div>

<script src="firebase.js"></script>

<script>
const db = firebase.database();
const ADMIN_PASSWORD = "aman"; // እዚህ ጋር የአድሚን ፓስወርድዎን መቀየር ይችላሉ

// ባለቤቶችን (Owners) ከፋየርቤስ አምጥቶ በ Dropdown ውስጥ መሙላት
db.ref("owners").on("value", (snapshot) => {
    let options = '<option value="">-- ባለቤት ይምረጡ --</option>';
    snapshot.forEach((item) => {
        let data = item.val();
        options += `<option value="${data.name}">${data.name}</option>`;
    });
    document.getElementById("productOwner").innerHTML = options;
});

// 🔐 አድሚን ፓስወርድ ማረጋገጫ ለ Add Product
function checkPasswordAndAdd() {
    let pass = prompt("🔐 እቃ ለመመዝገብ የአድሚን ፓስወርድ ያስገቡ፦");
    if (pass === ADMIN_PASSWORD) {
        addProduct();
    } else if (pass !== null) {
        alert("❌ የተሳሳተ ፓስወርድ!");
    }
}

function addProduct() {
    let owner = document.getElementById("productOwner").value;
    let name = document.getElementById("productName").value;
    let price = document.getElementById("productPrice").value;
    let stock = document.getElementById("productStock").value;

    if (owner == "") {
        alert("እባክዎ ባለቤት ይምረጡ");
        return;
    }
    if (name == "") {
        alert("እባክዎ የእቃውን ስም ያስገቡ");
        return;
    }
    if (price == "" || Number(price) <= 0) {
        alert("እባክዎ ትክክለኛ ዋጋ ያስገቡ");
        return;
    }
    if (stock == "" || Number(stock) <= 0) {
        alert("እባክዎ ትክክለኛ ብዛት (Quantity) ያስገቡ");
        return;
    }

    db.ref("products").push({
        owner: owner,
        name: name,
        price: Number(price),
        stock: Number(stock),
        date: new Date().toLocaleString()
    });

    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productStock").value = "";
    alert("✅ እቃው በተሳካ ሁኔታ ተመዝግቧል!");
}

// 🔐 አድሚን ፓስወርድ ማረጋገጫ ለ Delete Product
function checkPasswordAndDelete(productId) {
    let pass = prompt("🔐 ይህንን እቃ ለማጥፋት የአድሚን ፓስወርድ ያስገቡ፦");
    if (pass === ADMIN_PASSWORD) {
        deleteProduct(productId);
    } else if (pass !== null) {
        alert("❌ የተሳሳተ ፓስወርድ!");
    }
}

function deleteProduct(productId) {
    if (confirm("ይህንን እቃ ከዝርዝሩ ማጥፋት (Delete ማድረግ) እርግጠኛ ነዎት?")) {
        db.ref("products/" + productId).remove().then(() => {
            alert("እቃው ተሰርዟል!");
        }).catch((error) => {
            alert("ስህተት ተፈጥሯል: " + error.message);
        });
    }
}

// የእቃዎች ዝርዝር ማሳያ (ከነ Delete በተን ጋር)
db.ref("products").on("value", (snapshot) => {
    let listHTML = "";

    snapshot.forEach((item) => {
        let productId = item.key;
        let data = item.val();

        listHTML += `
            <li style="margin-bottom: 10px;">
                👤 ባለቤት: <b>${data.owner}</b><br>
                📦 እቃ: <b>${data.name}</b> | ዋጋ: <b>${data.price} ETB</b> | ቀሪ ብዛት: <b>${data.stock}</b><br>
                <small style="color:gray;">${data.date || ''}</small><br>
                <button onclick="checkPasswordAndDelete('${productId}')" style="background-color: #d9534f; color: white; padding: 2px 6px; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; margin-top: 4px;">🗑️ Delete</button>
            </li><hr>
        `;
    });

    document.getElementById("productList").innerHTML = listHTML || "<li>ምንም የተመዘገበ እቃ የለም</li>";
});
</script>

</body>
</html>
