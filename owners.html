<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owners - Cozy's Wear</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

</head>

<body>

<header>
<h1>👤 Owners</h1>
<p>የእቃ ባለቤቶች መመዝገቢያ</p>
</header>

<!-- ⬅️ Back በተን (ወደ ዋናው ገጽ ለመመለስ) -->
<div>
<a href="index.html" class="back-btn">⬅️ Back</a>
</div>

<div class="card">

<input id="ownerName" placeholder="የባለቤት ስም">

<input id="ownerPhone" placeholder="ስልክ ቁጥር">

<!-- በተኑን ሲነኩ ፓስወርድ ይጠይቃል -->
<button onclick="checkPasswordAndAdd()">
➕ Add Owner
</button>

</div>


<div class="card">

<h2>Owners List</h2>

<ul id="ownerList"></ul>

</div>


<script src="firebase.js"></script>

<script>

const db = firebase.database();
const ADMIN_PASSWORD = "aman"; // እዚህ ጋር የሚፈልጉትን የራስዎን ፓስወርድ ማድረግ ይችላሉ

// 🔐 አድሚን ፓስወርድ ማረጋገጫ
function checkPasswordAndAdd() {
    let pass = prompt("🔐 ባለቤት ለመመዝገብ የአድሚን ፓስወርድ ያስገቡ፦");
    if (pass === ADMIN_PASSWORD) {
        addOwner();
    } else if (pass !== null) {
        alert("❌ የተሳሳተ ፓስወርድ!");
    }
}

function addOwner(){

let name = document.getElementById("ownerName").value;
let phone = document.getElementById("ownerPhone").value;

if(name==""){
alert("ስም ያስገቡ");
return;
}

db.ref("owners").push({

name:name,
phone:phone

});

document.getElementById("ownerName").value="";
document.getElementById("ownerPhone").value="";
alert("✅ ባለቤቱ በተሳካ ሁኔታ ተመዝግቧል!");

}

db.ref("owners").on("value",(snapshot)=>{

let list="";

snapshot.forEach((item)=>{

let data=item.val();

list += `
<li>
${data.name} - ${data.phone}
</li>
`;

});

document.getElementById("ownerList").innerHTML=list;

});

</script>

</body>
</html>
